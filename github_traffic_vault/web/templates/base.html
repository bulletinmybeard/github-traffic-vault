<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Traffic Vault</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% if flash_error is defined and flash_error %}
    <div class="toast toast-err" id="flash-toast" role="alert">{{ flash_error }}</div>
    {% endif %}
    <script>
        // Disable the sync button + show a spinner while the request is
        // in flight. Plain form POST (no htmx), so the browser navigates
        // to the redirect target when sync completes.
        document.addEventListener("submit", function (e) {
            let form = e.target;
            if (!form.classList.contains("sync-form")) {
                return;
            }
            let btn = form.querySelector("button[type=submit]");
            if (!btn) {
                return;
            }
            btn.disabled = true;
            btn.classList.add("loading");
        });

        // One-shot toast: auto-hide and strip legacy ?error= from the URL.
        (function () {
            var toast = document.getElementById("flash-toast");
            var params = new URLSearchParams(window.location.search);
            if (params.has("error")) {
                params.delete("error");
                var qs = params.toString();
                var clean = window.location.pathname + (qs ? "?" + qs : "") + window.location.hash;
                window.history.replaceState(null, "", clean);
            }
            if (!toast) {
                return;
            }
            window.setTimeout(function () {
                toast.classList.add("toast-hide");
            }, 5000);
            window.setTimeout(function () {
                toast.remove();
            }, 5600);
        })();
    </script>
    <script src="/static/period-menu.js"></script>
</body>
</html>
