services:
  github-traffic-vault:
    build: .
    container_name: github-traffic-vault
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ./github_traffic_vault:/app/github_traffic_vault
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    command:
      [
        "github-traffic-vault",
        "--config",
        "/app/config.yaml",
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "8800",
        "--reload",
      ]
