[tool.poetry]
name = "github-traffic-vault"
version = "0.2.0"
description = "Permanently archive GitHub repo traffic data (views, clones, referrers, paths)"
authors = ["Robin Schulz <bulletinmybeard@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bulletinmybeard/github-traffic-vault"
repository = "https://github.com/bulletinmybeard/github-traffic-vault"
documentation = "https://github.com/bulletinmybeard/github-traffic-vault#readme"
keywords = ["github", "traffic", "analytics", "archive", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
packages = [{include = "github_traffic_vault"}]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28.1"
sqlalchemy = "^2.0.50"
chalkbox = "^2.3.5"
fastapi = "^0.136.3"
uvicorn = {extras = ["standard"], version = "^0.49.0"}
jinja2 = "^3.1.6"
python-multipart = "^0.0.32"
itsdangerous = "^2.2.0"
tzdata = "^2026.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.16"
mypy = "^2.1.0"

[tool.poetry.scripts]
github-traffic-vault = "github_traffic_vault.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["github_traffic_vault"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = false
