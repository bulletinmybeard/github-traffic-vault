name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Verify poetry.lock is up-to-date
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --sync

      # Ruff comes from the lockfile, so `format --check` matches local output
      # exactly (no separate version pin to drift). Bump via `poetry update ruff`.
      - name: Ruff lint
        run: poetry run ruff check github_traffic_vault

      - name: Ruff format check
        run: poetry run ruff format --check github_traffic_vault

      - name: Mypy (strict)
        run: poetry run mypy

  smoke:
    name: Smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction --sync

      # `github-traffic-vault --help` imports the whole CLI tree (all imports live at
      # module top), so this also validates that the import graph resolves
      # cleanly on each supported interpreter.
      - name: Smoke test CLI
        run: poetry run github-traffic-vault --help

  build:
    name: Build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: pipx run build

      - name: Verify package version is set
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["tool"]["poetry"]["version"]
          assert version, "empty package version in pyproject.toml"
          print(f"package version: {version}")
          PY

      - name: Verify wheel installs + CLI runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/github-traffic-vault --help

      - name: Inspect artifact contents
        run: |
          ls -la dist/
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); print('\n'.join(z.namelist()[:25]))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-traffic-vault-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: github-traffic-vault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-summary:
    name: CI Summary
    needs: [lint, smoke, build, docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint, format & types | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke | ${{ needs.smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build & verify wheel | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker image build | ${{ needs.docker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.docker.result }}" = "success" ]; then
            echo "All CI checks passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some CI checks failed - see the jobs above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
