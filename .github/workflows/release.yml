name: Release

on:
  push:
    tags:
      - 'v*'         # version tags, e.g. v0.2.0
  workflow_dispatch:  # manual release of an existing tag
    inputs:
      tag_name:
        description: 'Git tag to release (e.g. v0.2.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      # Untrusted input (workflow_dispatch tag_name) goes through env, never
      # interpolated straight into the shell, to avoid command injection.
      - name: Resolve tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Build wheel + sdist
        run: poetry build

      # Guards against tagging a release without bumping the version: the wheel
      # version comes from pyproject, the tag is independent. Fails if they both
      # disagree instead of shipping a mislabeled release.
      - name: Verify wheel installs, CLI runs, version matches tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/github-traffic-vault --help
          INSTALLED=$(/tmp/verify/bin/python -c "import github_traffic_vault as g; print(g.__version__)")
          echo "tag version: $VERSION | package __version__: $INSTALLED"
          if [ "$VERSION" != "$INSTALLED" ]; then
            echo "::error::tag $TAG does not match package __version__ ($INSTALLED) -- bump the version before tagging"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-traffic-vault-dist
          path: dist/
          retention-days: 7

  create-github-release:
    name: Create GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Untrusted input (workflow_dispatch tag_name) goes through env, never
      # interpolated straight into the shell, to avoid command injection.
      - name: Resolve tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: github-traffic-vault-dist
          path: dist/

      - name: Extract version
        id: version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          WHEEL_FILE=$(ls dist/*.whl | xargs -n1 basename)

          # Pull the CHANGELOG block for this version (between its header and the next "## [")
          CHANGELOG_SECTION=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | grep -v "^## \[" | sed '/^$/d' || echo "")

          cat > release_notes.md <<NOTES_EOF
          ## Installation

          Install the wheel attached to this release:

          \`\`\`bash
          pip install https://github.com/${REPO}/releases/download/${TAG}/${WHEEL_FILE}
          \`\`\`

          Or deploy via Docker -- see the [README](https://github.com/${REPO}#readme).

          ## Links

          | | |
          |---|---|
          | Documentation | [README](https://github.com/${REPO}#readme) |
          | Changelog | [CHANGELOG.md](https://github.com/${REPO}/blob/master/CHANGELOG.md) |

          ## What's Changed

          ${CHANGELOG_SECTION}

          NOTES_EOF

          cat >> release_notes.md <<'CHECKSUMS_EOF'
          ## Package checksums (SHA256)

          | File | SHA256 |
          |------|--------|
          CHECKSUMS_EOF

          while read -r hash filename; do
            echo "| \`$filename\` | \`$hash\` |" >> release_notes.md
          done < dist/checksums.txt

          cat >> release_notes.md <<ASSETS_EOF

          ## Assets

          - Python wheel (\`.whl\`) -- universal, all platforms
          - Source distribution (\`.tar.gz\`)
          - \`checksums.txt\` -- SHA256 sums

          ---

          **Full changelog**: https://github.com/${REPO}/blob/master/CHANGELOG.md
          ASSETS_EOF

          # Fallback if no matching CHANGELOG section was found
          if [ -z "$CHANGELOG_SECTION" ]; then
            cat > release_notes.md <<FALLBACK_EOF
          ## Release ${VERSION}

          See the full changelog: https://github.com/${REPO}/blob/master/CHANGELOG.md
          FALLBACK_EOF
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, 'alpha') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release summary
        env:
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release summary"
            echo ""
            echo "**Tag**: $TAG"
            echo "**Version**: $VERSION"
            echo "**Release**: $SERVER_URL/$REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
